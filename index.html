<!-- ========== EXTRA SUBJECTS AUTO-LOADER ========== -->
<script>
(function() {
  /* ============================================================
     📚 EASY CONFIG — Add new subjects here!
     Each line = one new menu button + one new page.
     Just create the HTML file in your repo (e.g. shapes.html)
     and add its details below.
     ============================================================ */
  var EXTRA_SUBJECTS = [
    {
      id: 'shapes',
      emoji: '📐',
      titleEn: 'Shapes',
      titleAr: 'الأشكال',
      file: 'shapes.html'
    }
    // 👇 Uncomment these when you create the files:
    // ,{
    //   id: 'space',
    //   emoji: '🚀',
    //   titleEn: 'Space',
    //   titleAr: 'الفضاء',
    //   file: 'space.html'
    // }
  ];

  // Detect current language (matches the main site's localStorage)
  function currentLang() {
    try { return localStorage.getItem('mathKingdomLang') || 'en'; }
    catch(e) { return 'en'; }
  }

  // ============================================================
  // Build the menu buttons + page containers automatically
  // ============================================================
  function injectSubjects() {
    var navLinks = document.getElementById('navLinks');
    if (!navLinks) return false;

    // Find where the pages live (main container)
    var pagesContainer = document.querySelector('.game-container') || document.body;

    // Reference: the "Parents" button, so we insert before it
    var parentBtn = navLinks.querySelector('[data-page="parents"]');

    EXTRA_SUBJECTS.forEach(function(subj) {
      // Skip if already added
      if (document.getElementById(subj.id + 'NavBtn')) return;

      var lang = currentLang();
      var label = (lang === 'ar' ? subj.titleAr : subj.titleEn);

      // 1) Nav button
      var btn = document.createElement('button');
      btn.className = 'nav-btn';
      btn.id = subj.id + 'NavBtn';
      btn.dataset.page = subj.id;
      btn.dataset.i18n = 'nav_' + subj.id;
      btn.textContent = subj.emoji + ' ' + label;
      if (parentBtn) navLinks.insertBefore(btn, parentBtn);
      else navLinks.appendChild(btn);

      // 2) Page container with iframe
      var page = document.createElement('div');
      page.className = 'page';
      page.id = 'page-' + subj.id;
      page.innerHTML =
        '<div class="page-header">' +
          '<h1>' + subj.emoji + ' ' + label + '</h1>' +
        '</div>' +
        '<div style="position:relative; width:100%; height:85vh; min-height:600px; border-radius:24px; overflow:hidden; border:3px solid #ffd966; background:#0d47a1;">' +
          '<iframe id="' + subj.id + 'Frame" style="width:100%; height:100%; border:none; display:block;" title="' + label + '"></iframe>' +
        '</div>';
      pagesContainer.appendChild(page);

      // 3) Click handler — load the iframe lazily and switch pages
      btn.addEventListener('click', function() {
        openSubject(subj);
      });
    });

    // Patch the main site's showPage so any programmatic call works too
    if (typeof window.showPage === 'function' && !window.__extraSubjectsPatched) {
      var original = window.showPage;
      window.showPage = function(pageId) {
        var subj = EXTRA_SUBJECTS.find(function(s) { return s.id === pageId; });
        if (subj) {
          openSubject(subj);
          return;
        }
        return original.apply(this, arguments);
      };
      window.__extraSubjectsPatched = true;
    }

    return true;
  }

  // Open a subject page
  function openSubject(subj) {
    // Switch pages
    document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
    var page = document.getElementById('page-' + subj.id);
    if (page) page.classList.add('active');

    // Highlight nav
    document.querySelectorAll('.nav-btn').forEach(function(b) {
      b.classList.toggle('active', b.dataset.page === subj.id);
    });

    // Close mobile menu
    var nl = document.getElementById('navLinks');
    if (nl) nl.classList.remove('open');

    // Lazy-load the iframe
    var frame = document.getElementById(subj.id + 'Frame');
    if (frame && frame.dataset.loaded !== 'true') {
      frame.src = subj.file;
      frame.dataset.loaded = 'true';
    }

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // Retry injection a few times (in case menu isn't built yet)
  var attempts = 0;
  var iv = setInterval(function() {
    if (injectSubjects() || ++attempts > 40) clearInterval(iv);
  }, 100);
  window.addEventListener('load', injectSubjects);

  // Re-render labels when language is toggled
  document.addEventListener('click', function(e) {
    if (e.target && (e.target.id === 'langToggle' || e.target.closest && e.target.closest('#langToggle'))) {
      setTimeout(function() {
        var lang = currentLang();
        EXTRA_SUBJECTS.forEach(function(subj) {
          var btn = document.getElementById(subj.id + 'NavBtn');
          if (btn) {
            var label = (lang === 'ar' ? subj.titleAr : subj.titleEn);
            btn.textContent = subj.emoji + ' ' + label;
          }
        });
      }, 200);
    }
  });
})();
</script>
<!-- ========== END EXTRA SUBJECTS AUTO-LOADER ========== -->
